name: Parts library → Notion sync

# Keeps the Notion PCB Wiki, Boards and BOM Lines databases in step with the
# KiCad parts library and every board schematic in a season folder.
# One-time setup: see "26-27/Standard Parts Library/sync/README.md".
on:
  push:
    branches: [main]
    paths:
      - "**.kicad_sch"
      - "**.kicad_pro"
      - "26-27/Standard Parts Library/**"
      - ".gitmodules"
      - "26-27/VCU"   # submodule link to OTA-pcb-testing moved to a newer commit
  schedule:
    - cron: "0 9 * * *"   # nightly (2 am Pacific) to catch edits made in Notion
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (read Notion, change nothing)"
        type: boolean
        default: false

concurrency:
  group: parts-library-sync
  cancel-in-progress: false

permissions:
  contents: write   # commits appdata/notion-info.json (who added each part, what it replaces)
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: kicad/kicad:10.0.6
      options: --user root
    steps:
      - name: Install git and python
        run: |
          command -v git >/dev/null && command -v python3 >/dev/null || \
            (apt-get update -qq && apt-get install -y -qq git python3)
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # boards linked from other repos, e.g. 26-27/VCU
      - name: Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SYNC_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          KICAD_CLI: kicad-cli
          HOME: /tmp/home   # kicad-cli wants a writable config dir
        run: |
          # HOME must exist before git config --global, or git exits 255 ("could not lock config file")
          mkdir -p "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "26-27/Standard Parts Library/sync"
          python3 anteater_sync.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit the Notion info shown in the Library Manager
        if: ${{ !inputs.dry_run }}
        run: |
          f="26-27/Standard Parts Library/Anteater Parts/appdata/notion-info.json"
          [ -f "$f" ] || exit 0
          git add "$f"
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update part info from Notion (added by, replaces)"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME:-main}" && git push --quiet origin HEAD:"${GITHUB_REF_NAME:-main}" && exit 0
            sleep 5
          done
          exit 1
      - name: Open an issue if the sync failed
        if: failure() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            // one open issue for all failures (a comment per failure), not a new issue every run
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const log = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const body = `The Notion sync failed (${context.eventName}, ${context.sha.slice(0, 8)}). Log: ${log}`;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...repo, state: "open", per_page: 100 });
            const existing = open.find((i) => !i.pull_request && i.title.startsWith("Parts library sync"));
            if (existing) {
              await github.rest.issues.createComment({ ...repo, issue_number: existing.number, body });
            } else {
              const author = context.payload.head_commit?.author?.username;
              await github.rest.issues.create({ ...repo, title: "Parts library sync is failing", body,
                assignees: author ? [author] : [] });
            }
